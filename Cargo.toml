[package]
name = "ella-world"
version = "0.3.0"
edition = "2021"
description = "Standalone Rust 3D multiplayer hangout, Dress to Impress wardrobe & spatial voice server powered by Hybrid WebSocket Spine + Zero-Renegotiation UDP SFU"
license = "MIT"
readme = "README.md"
keywords = ["gamedev", "udp", "webrtc", "sfu", "websocket"]
categories = ["games", "network-programming", "multimedia::audio"]

[lib]
name = "ella_world"
path = "src/lib.rs"

[[bin]]
name = "ella-world-server"
path = "src/main.rs"

[[bin]]
name = "ella-stress"
path = "src/bin/stress.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["json", "ws"] }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "service"] }
rand = "0.8"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.5"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["fs", "cors", "compression-gzip", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webpki-roots = "0.26"
webrtc = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
