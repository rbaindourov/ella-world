# Nginx reverse-proxy snippet for standalone Rust `ella-world-server` (127.0.0.1:8097)
# Note: Only static WebGL assets, auth, and the 1-shot WebRTC SDP offer/answer traverse HTTPS.
# All live Opus voice audio and 20Hz 3D game-state datagrams flow directly over UDP (:44444/udp).

location ^~ /api/ella-world/ {
    proxy_pass http://127.0.0.1:8097/api/ella-world/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}

location = /ella-world {
    return 301 /ella-world/;
}

location ^~ /ella-world/ {
    proxy_pass http://127.0.0.1:8097/ella-world/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
